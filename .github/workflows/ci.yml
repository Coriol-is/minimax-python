name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to the repository.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src tests
      - name: Generated code is not stale
        run: uv run python scripts/generate.py --check
      - name: Tests
        run: uv run pytest -v --cov --cov-report=term-missing

  build:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Build sdist and wheel
        run: uv build
      - name: Validate package metadata
        run: uv run --no-project --with "twine>=6.1" twine check dist/*
      - name: The wheel must ship the PEP 561 marker
        # Without py.typed an installed package exposes no types at all, which
        # would silently negate every generated annotation in it.
        run: uv run --no-project python -m zipfile -l dist/*.whl | grep -q "minimax_api/py.typed"
      - name: Import the built wheel in a clean environment
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import minimax_api
          from minimax_api.models import Customer
          print(minimax_api.RS.base_url)
          print(Customer.model_validate({'CustomerId': 1}).customer_id)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
