[project]
name = "minimax-api"
version = "0.1.0"
description = "Python client for the Minimax (Saop) accounting REST API — not the MiniMax AI platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Coriolis" }]
keywords = ["minimax", "saop", "accounting", "serbia", "erp", "invoicing", "efaktura"]
dependencies = ["httpx>=0.27", "pydantic>=2.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Coriol-is/minimax-python"
Repository = "https://github.com/Coriol-is/minimax-python"
Issues = "https://github.com/Coriol-is/minimax-python/issues"
Changelog = "https://github.com/Coriol-is/minimax-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_api"]

[tool.hatch.build.targets.sdist]
# The sdist carries everything needed to regenerate the client from scratch:
# the vendored API surface and the generator that reads it. Without those, a
# consumer holding only the sdist could not reproduce `_generated/`.
include = [
  "/src",
  "/tests",
  "/scripts",
  "/spec",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/.env.example",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.9", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The default run is offline. Live tests need real credentials and spend
# from the organisation's daily request budget, so they are opt-in.
addopts = ["-m", "not live"]
markers = ["live: makes real calls to moj.minimax.rs using credentials from .env"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["minimax_api"]
branch = true
omit = [
  # Machine-written: 178 thin wrappers whose correctness is pinned by the
  # generator's own tests, not by calling each one at runtime.
  "*/minimax_api/_generated/*",
]

[tool.coverage.report]
show_missing = true
# The hand-written layers sit at 98%. The floor is deliberately a little below
# that: it catches a whole path going untested, without failing a build over a
# defensive branch nobody can reach from a test.
fail_under = 95
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Every generated model declares `populate_by_name=True` (via MinimaxModel) and
# every field carries an explicit `Field(alias=...)`. Without this plugin, mypy
# synthesizes constructor signatures from `dataclass_transform` using only the
# alias, and rejects the Python-name keyword arguments this library's contract
# explicitly allows. The plugin understands `populate_by_name` and accepts both.
plugins = ["pydantic.mypy"]
# `tests/test_generator_models.py` imports `generate` via a sys.path hack
# (see that file) so it can test the generator without installing `scripts/`
# as a package; this lets mypy resolve the same import.
mypy_path = ["scripts"]

[[tool.mypy.overrides]]
# Generated code is checked, but its dynamic construction defeats some inference.
module = "minimax_api._generated.*"
disallow_any_explicit = false

[tool.pydantic-mypy]
# Without these, the plugin sees `MinimaxModel`'s `extra="allow"` and synthesizes
# a permissive `__init__(self, **data: Any)` for every model, which silently
# stops checking constructor argument types altogether. `init_typed` restores
# per-field typing on the synthesized `__init__`; `init_forbid_extra` stops
# `extra="allow"` (a *runtime* parsing behaviour) from also disabling
# *construction-time* keyword checking.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
